# Dependabot version updates for the workflows in .github/workflows/.
#
# Every action there is pinned to a full commit SHA (with its release tag kept
# as a trailing comment) so a re-tagged or compromised release cannot change
# the code CI runs. That pinning only stays current if something bumps it: this
# configuration opens a weekly pull request when a pinned action has a newer
# release, which is the update channel the workflows' own comments refer to.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Dependabot's commit and pull-request titles follow this repository's
    # Conventional Commits prefix (e.g. "chore(deps): bump ...") instead of its
    # bare default, so the generated history reads like the hand-written one.
    commit-message:
      prefix: "chore(deps)"
