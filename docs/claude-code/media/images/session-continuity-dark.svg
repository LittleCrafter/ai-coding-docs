<text x="459" y="247" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F5F5F5">claude --resume abc123</text>
<text x="459" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F5F5F5">--fork-session</text>


<path d="M369 250 L350 250" stroke="#D4A27F" stroke-width="1.5"/>
