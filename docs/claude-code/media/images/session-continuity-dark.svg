<text x="460" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#C4C4C4">appends to same session</text>


<text x="40" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Fork</text>


<line x1="40" y1="210" x2="220" y2="210" stroke="#383838" stroke-width="2"/>


<circle cx="60" cy="210" r="6" fill="#383838" stroke="#707070" stroke-width="1.5"/>
<circle cx="110" cy="210" r="6" fill="#383838" stroke="#707070" stroke-width="1.5"/>
<circle cx="160" cy="210" r="6" fill="#383838" stroke="#707070" stroke-width="1.5"/>


<circle cx="160" cy="210" r="10" fill="none" stroke="#D4A27F" stroke-width="2"/>


