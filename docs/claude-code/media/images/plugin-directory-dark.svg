<svg width="760" height="336" viewBox="0 0 760 336" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>A plugin is one directory of components</title>
<rect width="760" height="336" rx="6" fill="#1A1A1A"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C4C4C4"/></marker></defs>
<text x="380" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">A plugin is one directory of components</text>
<text x="30" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C4C4C4">In the plugin directory</text>
<text x="450" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C4C4C4">In your session</text>
<rect x="30" y="74" width="320" height="244" rx="8" fill="#383838" stroke="#D4A27F" stroke-width="1.5"/>
<text x="48" y="99" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#F5F5F5">my-plugin/</text>
<rect x="48" y="112" width="284" height="30" rx="4" fill="#2C2C2C"/>
<text x="60" y="131" font-family="ui-monospace, monospace" font-size="11.5" fill="#F5F5F5">.claude-plugin/plugin.json</text>
<line x1="332" y1="127" x2="447" y2="127" stroke="#C4C4C4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="112" width="280" height="30" rx="6" fill="#383838"/>
<text x="464" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Plugin name</text>
<text x="716" y="131" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#C4C4C4">my-plugin</text>
<rect x="48" y="148" width="284" height="30" rx="4" fill="#2C2C2C"/>
<text x="60" y="167" font-family="ui-monospace, monospace" font-size="11.5" fill="#F5F5F5">skills/review/SKILL.md</text>
<line x1="332" y1="163" x2="447" y2="163" stroke="#C4C4C4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="148" width="280" height="30" rx="6" fill="#383838"/>
<text x="464" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Skill</text>
<text x="716" y="167" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#C4C4C4">/my-plugin:review</text>
<rect x="48" y="184" width="284" height="30" rx="4" fill="#2C2C2C"/>
<text x="60" y="203" font-family="ui-monospace, monospace" font-size="11.5" fill="#F5F5F5">agents/reviewer.md</text>
<line x1="332" y1="199" x2="447" y2="199" stroke="#C4C4C4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="184" width="280" height="30" rx="6" fill="#383838"/>
<text x="464" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Subagent</text>
<text x="716" y="203" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C4C4C4">Claude can delegate to it</text>
<rect x="48" y="220" width="284" height="30" rx="4" fill="#2C2C2C"/>
<text x="60" y="239" font-family="ui-monospace, monospace" font-size="11.5" fill="#F5F5F5">hooks/hooks.json</text>
<line x1="332" y1="235" x2="447" y2="235" stroke="#C4C4C4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="220" width="280" height="30" rx="6" fill="#383838"/>
<text x="464" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Hooks</text>
<text x="716" y="239" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C4C4C4">run on lifecycle events</text>
<rect x="48" y="256" width="284" height="30" rx="4" fill="#2C2C2C"/>
<text x="60" y="275" font-family="ui-monospace, monospace" font-size="11.5" fill="#F5F5F5">.mcp.json</text>
<line x1="332" y1="271" x2="447" y2="271" stroke="#C4C4C4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="256" width="280" height="30" rx="6" fill="#383838"/>
<text x="464" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">MCP server</text>
<text x="716" y="275" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C4C4C4">gives Claude tools</text>
<text x="190" y="306" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C4C4C4">and other components</text>
</svg>
