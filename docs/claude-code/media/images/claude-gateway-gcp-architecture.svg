<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" aria-labelledby="ttl desc" font-family="system-ui, -apple-system, sans-serif">
  <title id="ttl">Claude apps gateway on Google Cloud</title>
  <desc id="desc">Diagram showing Claude apps gateway deployed on Google Cloud. Claude Code clients reach the gateway over HTTPS. The gateway (on Cloud Run or GKE) and a private-IP Cloud SQL database both run inside a VPC, and the gateway connects to Cloud SQL. The gateway authenticates clients against an OIDC identity provider, reads config and secrets from Secret Manager, and forwards model requests to Agent Platform, Google's managed home for Claude inference. Artifact Registry supplies the gateway image at deploy time (shown as a dashed arrow).</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#757575"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="760" height="400" rx="6" fill="#F9F9F7"/>

  
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1E1E">Claude apps gateway on Google Cloud</text>

  
  <rect x="180" y="58" width="564" height="322" rx="6" fill="none" stroke="#757575" stroke-width="1"/>
  <text x="194" y="78" font-size="12" font-weight="600" fill="#757575">GCP project</text>

  
  <rect x="212" y="86" width="232" height="212" rx="6" fill="#FAFAFA" stroke="#B0B0B0" stroke-width="1"/>
  <text x="224" y="105" font-size="11" font-weight="600" fill="#757575">VPC (private)</text>

  
  <rect x="240" y="114" width="176" height="54" rx="6" fill="#D4E4D8" stroke="#757575" stroke-width="1"/>
  <text x="328" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Cloud SQL</text>
  <text x="328" y="154" text-anchor="middle" font-size="11" fill="#757575">PostgreSQL · session state</text>

  
  <rect x="240" y="212" width="176" height="64" rx="6" fill="#EDE8F4" stroke="#D4A27F" stroke-width="2"/>
  <text x="328" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Claude apps gateway</text>
  <text x="328" y="255" text-anchor="middle" font-size="11" fill="#757575">Cloud Run or GKE</text>

  
  <rect x="520" y="212" width="176" height="64" rx="6" fill="#EDEDEB" stroke="#757575" stroke-width="1"/>
  <text x="608" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Agent Platform</text>
  <text x="608" y="255" text-anchor="middle" font-size="11" fill="#757575">Claude inference</text>

  
  <rect x="212" y="316" width="112" height="48" rx="6" fill="#EDEDEB" stroke="#757575" stroke-width="1"/>
  <text x="268" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Artifact Registry</text>
  <text x="268" y="352" text-anchor="middle" font-size="11" fill="#757575">gateway image</text>

  <rect x="332" y="316" width="112" height="48" rx="6" fill="#EDEDEB" stroke="#757575" stroke-width="1"/>
  <text x="388" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Secret Manager</text>
  <text x="388" y="352" text-anchor="middle" font-size="11" fill="#757575">config + secrets</text>

  
  <rect x="16" y="90" width="140" height="54" rx="6" fill="#E8E8E4" stroke="#757575" stroke-width="1"/>
  <text x="86" y="112" text-anchor="middle" font-size="12" font-weight="500" fill="#1E1E1E">Claude Code clients</text>
  <text x="86" y="129" text-anchor="middle" font-size="11" fill="#757575">developer laptops</text>

  <rect x="16" y="246" width="140" height="54" rx="6" fill="#E8E8E4" stroke="#757575" stroke-width="1"/>
  <text x="86" y="268" text-anchor="middle" font-size="12" font-weight="500" fill="#1E1E1E">Identity Provider</text>
  <text x="86" y="285" text-anchor="middle" font-size="11" fill="#757575">Google Workspace</text>

  
  
  <line x1="156" y1="117" x2="238" y2="216" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="168" y="146" width="40" height="15" fill="#F9F9F7"/>
  <text x="188" y="157" text-anchor="middle" font-size="11" fill="#1E1E1E">HTTPS</text>

  
  <line x1="238" y1="258" x2="158" y2="276" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="162" y="248" width="60" height="15" fill="#F9F9F7"/>
  <text x="192" y="259" text-anchor="middle" font-size="11" fill="#1E1E1E">OIDC login</text>

  
  <line x1="328" y1="212" x2="328" y2="170" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>

  
  <line x1="416" y1="244" x2="518" y2="244" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="424" y="221" width="84" height="14" fill="#F9F9F7"/>
  <text x="466" y="232" text-anchor="middle" font-size="11" fill="#1E1E1E">model requests</text>

  
  <line x1="388" y1="276" x2="388" y2="314" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="288" width="74" height="15" fill="#F9F9F7"/>
  <text x="400" y="299" text-anchor="start" font-size="11" fill="#1E1E1E">reads secrets</text>

  
  <line x1="268" y1="316" x2="268" y2="278" stroke="#757575" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <rect x="176" y="291" width="86" height="15" fill="#F9F9F7"/>
  <text x="262" y="302" text-anchor="end" font-size="11" fill="#1E1E1E">image at deploy</text>
</svg>
