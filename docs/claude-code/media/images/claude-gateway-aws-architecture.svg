<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" aria-labelledby="ttl desc" font-family="system-ui, -apple-system, sans-serif">
  <title id="ttl">Claude apps gateway on AWS</title>
  <desc id="desc">Diagram showing Claude apps gateway deployed on AWS. Claude Code clients connect over HTTPS to an internal Application Load Balancer fronting the gateway (on ECS Fargate or EKS), which runs in private subnets alongside an Amazon RDS for PostgreSQL instance for session state. The gateway signs users in via OIDC against the corporate identity provider, reads secrets from AWS Secrets Manager, and forwards model requests to Amazon Bedrock — or Claude Platform on AWS — using its IAM role. Amazon ECR supplies the gateway image at deploy time (shown as a dashed arrow).</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#757575"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="820" height="430" rx="6" fill="#F9F9F7"/>

  
  <text x="410" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1E1E">Claude apps gateway on AWS</text>

  
  <rect x="180" y="58" width="624" height="352" rx="6" fill="none" stroke="#757575" stroke-width="1"/>
  <text x="194" y="78" font-size="12" font-weight="600" fill="#757575">AWS account</text>

  
  <rect x="212" y="86" width="320" height="222" rx="6" fill="#FAFAFA" stroke="#B0B0B0" stroke-width="1"/>
  <text x="224" y="105" font-size="11" font-weight="600" fill="#757575">VPC (private subnets)</text>

  
  <rect x="340" y="114" width="176" height="54" rx="6" fill="#D4E4D8" stroke="#757575" stroke-width="1"/>
  <text x="428" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Amazon RDS</text>
  <text x="428" y="154" text-anchor="middle" font-size="11" fill="#757575">PostgreSQL · session state</text>

  
  <rect x="228" y="220" width="92" height="56" rx="6" fill="#EDEDEB" stroke="#757575" stroke-width="1"/>
  <text x="274" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Internal ALB</text>
  <text x="274" y="261" text-anchor="middle" font-size="11" fill="#757575">private DNS</text>

  
  <rect x="340" y="212" width="176" height="64" rx="6" fill="#EDE8F4" stroke="#D4A27F" stroke-width="2"/>
  <text x="428" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Claude apps gateway</text>
  <text x="428" y="255" text-anchor="middle" font-size="11" fill="#757575">ECS Fargate or EKS</text>

  
  <rect x="584" y="212" width="192" height="64" rx="6" fill="#EDEDEB" stroke="#757575" stroke-width="1"/>
  <text x="680" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Amazon Bedrock</text>
  <text x="680" y="255" text-anchor="middle" font-size="11" fill="#757575">or Claude Platform on AWS</text>

  
  <rect x="212" y="336" width="150" height="48" rx="6" fill="#EDEDEB" stroke="#757575" stroke-width="1"/>
  <text x="287" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Amazon ECR</text>
  <text x="287" y="372" text-anchor="middle" font-size="11" fill="#757575">gateway image</text>

  <rect x="374" y="336" width="150" height="48" rx="6" fill="#EDEDEB" stroke="#757575" stroke-width="1"/>
  <text x="449" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1E1E">Secrets Manager</text>
  <text x="449" y="372" text-anchor="middle" font-size="11" fill="#757575">secrets</text>

  
  <rect x="16" y="90" width="140" height="54" rx="6" fill="#E8E8E4" stroke="#757575" stroke-width="1"/>
  <text x="86" y="112" text-anchor="middle" font-size="12" font-weight="500" fill="#1E1E1E">Claude Code clients</text>
  <text x="86" y="129" text-anchor="middle" font-size="11" fill="#757575">developer laptops</text>

  <rect x="16" y="286" width="140" height="54" rx="6" fill="#E8E8E4" stroke="#757575" stroke-width="1"/>
  <text x="86" y="308" text-anchor="middle" font-size="12" font-weight="500" fill="#1E1E1E">Identity Provider</text>
  <text x="86" y="325" text-anchor="middle" font-size="11" fill="#757575">Okta</text>

  
  
  <line x1="156" y1="117" x2="226" y2="225" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="160" y="152" width="44" height="15" fill="#F9F9F7"/>
  <text x="182" y="163" text-anchor="middle" font-size="11" fill="#1E1E1E">HTTPS</text>

  
  <line x1="320" y1="246" x2="338" y2="246" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>

  
  <line x1="356" y1="276" x2="158" y2="308" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="162" y="284" width="62" height="15" fill="#F9F9F7"/>
  <text x="193" y="295" text-anchor="middle" font-size="11" fill="#1E1E1E">OIDC login</text>

  
  <line x1="428" y1="212" x2="428" y2="170" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>

  
  <line x1="516" y1="244" x2="582" y2="244" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="508" y="221" width="84" height="14" fill="#F9F9F7"/>
  <text x="550" y="232" text-anchor="middle" font-size="11" fill="#1E1E1E">model requests</text>

  
  <line x1="449" y1="276" x2="449" y2="334" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="457" y="298" width="74" height="15" fill="#F9F9F7"/>
  <text x="461" y="309" text-anchor="start" font-size="11" fill="#1E1E1E">reads secrets</text>

  
  <line x1="287" y1="334" x2="358" y2="279" stroke="#757575" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <rect x="200" y="313" width="86" height="15" fill="#F9F9F7"/>
  <text x="286" y="324" text-anchor="end" font-size="11" fill="#1E1E1E">image at deploy</text>
</svg>
