<svg width="760" height="336" viewBox="0 0 760 336" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>A plugin is one directory of components</title>
<rect width="760" height="336" rx="6" fill="#F9F9F7"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#757575"/></marker></defs>
<text x="380" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1E1E1E">A plugin is one directory of components</text>
<text x="30" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#757575">In the plugin directory</text>
<text x="450" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#757575">In your session</text>
<rect x="30" y="74" width="320" height="244" rx="8" fill="#E8E8E4" stroke="#D4A27F" stroke-width="1.5"/>
<text x="48" y="99" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#1E1E1E">my-plugin/</text>
<rect x="48" y="112" width="284" height="30" rx="4" fill="#FAFAFA"/>
<text x="60" y="131" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E1E1E">.claude-plugin/plugin.json</text>
<line x1="332" y1="127" x2="447" y2="127" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="112" width="280" height="30" rx="6" fill="#E8E8E4"/>
<text x="464" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">Plugin name</text>
<text x="716" y="131" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#757575">my-plugin</text>
<rect x="48" y="148" width="284" height="30" rx="4" fill="#FAFAFA"/>
<text x="60" y="167" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E1E1E">skills/review/SKILL.md</text>
<line x1="332" y1="163" x2="447" y2="163" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="148" width="280" height="30" rx="6" fill="#E8E8E4"/>
<text x="464" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">Skill</text>
<text x="716" y="167" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#757575">/my-plugin:review</text>
<rect x="48" y="184" width="284" height="30" rx="4" fill="#FAFAFA"/>
<text x="60" y="203" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E1E1E">agents/reviewer.md</text>
<line x1="332" y1="199" x2="447" y2="199" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="184" width="280" height="30" rx="6" fill="#E8E8E4"/>
<text x="464" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">Subagent</text>
<text x="716" y="203" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#757575">Claude can delegate to it</text>
<rect x="48" y="220" width="284" height="30" rx="4" fill="#FAFAFA"/>
<text x="60" y="239" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E1E1E">hooks/hooks.json</text>
<line x1="332" y1="235" x2="447" y2="235" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="220" width="280" height="30" rx="6" fill="#E8E8E4"/>
<text x="464" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">Hooks</text>
<text x="716" y="239" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#757575">run on lifecycle events</text>
<rect x="48" y="256" width="284" height="30" rx="4" fill="#FAFAFA"/>
<text x="60" y="275" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E1E1E">.mcp.json</text>
<line x1="332" y1="271" x2="447" y2="271" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="256" width="280" height="30" rx="6" fill="#E8E8E4"/>
<text x="464" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">MCP server</text>
<text x="716" y="275" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#757575">gives Claude tools</text>
<text x="190" y="306" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#757575">and other components</text>
</svg>
